# Prometheus Configuration
# Scrapes metrics from application services and system exporters

global:
  scrape_interval: 15s # Scrape targets every 15 seconds
  evaluation_interval: 15s # Evaluate rules every 15 seconds
  scrape_timeout: 10s

  # Attach these labels to all time series
  external_labels:
    cluster: 'aix-survey'
    environment: 'staging'
    monitor: 'prometheus'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load alerting rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          instance: 'staging-server'

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'

  # Backend API metrics (NestJS - after Phase 03)
  - job_name: 'backend-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:3000']
        labels:
          service: 'backend-api'
          app: 'nestjs'

  # Frontend metrics (Next.js)
  - job_name: 'frontend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['frontend:3000']
        labels:
          service: 'frontend'
          app: 'nextjs'

  # PostgreSQL metrics (postgres_exporter - optional)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  # Redis metrics (redis_exporter - optional)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # Custom application metrics
  - job_name: 'application'
    metrics_path: '/api/admin/metrics'
    static_configs:
      - targets: ['frontend:3000']
        labels:
          service: 'application-metrics'

    # Basic authentication for admin metrics
    basic_auth:
      username: 'prometheus'
      password: 'changeme'

# Remote write configuration (optional - for long-term storage)
# remote_write:
#   - url: "http://your-remote-storage:9009/api/v1/write"
#     queue_config:
#       max_samples_per_send: 1000
