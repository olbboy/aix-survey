# Promtail Configuration
# Collects logs and ships them to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576 # 1MB

    # Retry configuration
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

    # External labels
    external_labels:
      cluster: 'aix-survey'
      environment: 'staging'

scrape_configs:
  # Application logs from Winston logger
  - job_name: application-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: application
          __path__: /app/logs/*.log

    pipeline_stages:
      # Parse JSON logs from Winston
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            service: service
            userId: userId
            error: error

      # Extract log level
      - labels:
          level:
          service:

      # Parse timestamp
      - timestamp:
          source: timestamp
          format: RFC3339

      # Output stage
      - output:
          source: message

  # System logs
  - job_name: system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/*.log

    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+\s+\S+)\s+(?P<hostname>\S+)\s+(?P<process>\S+):\s+(?P<message>.*)$'

      - labels:
          hostname:
          process:

      - timestamp:
          source: timestamp
          format: 'Jan 02 15:04:05'

      - output:
          source: message

  # Docker container logs
  - job_name: docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # Only keep containers with specific labels
      - source_labels: ['__meta_docker_container_label_logging']
        regex: enabled
        action: keep

      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.+)'
        target_label: container

      # Extract service name from container labels
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service

      # Extract project from container labels
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: project

    pipeline_stages:
      - docker: {}

      - json:
          expressions:
            level: level
            timestamp: time
            message: log

      - labels:
          level:

      - timestamp:
          source: timestamp
          format: RFC3339Nano

      - output:
          source: message

  # Nginx access logs
  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          log_type: access
          __path__: /var/log/nginx/access.log

    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+)\s+-\s+\S+\s+\[(?P<timestamp>[^\]]+)\]\s+"(?P<method>\S+)\s+(?P<path>\S+)\s+\S+"\s+(?P<status>\d+)\s+(?P<bytes>\d+)\s+"[^"]*"\s+"(?P<user_agent>[^"]*)".*$'

      - labels:
          method:
          status:

      - timestamp:
          source: timestamp
          format: '02/Jan/2006:15:04:05 -0700'

  # Nginx error logs
  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          log_type: error
          __path__: /var/log/nginx/error.log

    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}/\d{2}/\d{2}\s+\d{2}:\d{2}:\d{2})\s+\[(?P<level>\w+)\]\s+(?P<message>.*)$'

      - labels:
          level:

      - timestamp:
          source: timestamp
          format: '2006/01/02 15:04:05'

  # PostgreSQL logs
  - job_name: postgres
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgres
          __path__: /var/log/postgresql/*.log

    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d+\s+\S+)\s+\[(?P<pid>\d+)\]\s+(?P<level>\w+):\s+(?P<message>.*)$'

      - labels:
          level:

      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.999 MST'

  # Redis logs
  - job_name: redis
    static_configs:
      - targets:
          - localhost
        labels:
          job: redis
          __path__: /var/log/redis/*.log

    pipeline_stages:
      - regex:
          expression: '^(?P<pid>\d+):(?P<role>\w+)\s+(?P<timestamp>\d+\s+\w+\s+\d{4}\s+\d{2}:\d{2}:\d{2}\.\d+)\s+(?P<level>[\*\#\.\-])\s+(?P<message>.*)$'

      - labels:
          role:
          level:

      - timestamp:
          source: timestamp
          format: '02 Jan 2006 15:04:05.999'
